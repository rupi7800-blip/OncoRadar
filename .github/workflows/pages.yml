name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Scansione giornaliera']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepara i file pubblici
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icon.svg css js _site/
          if [ -d data ]; then cp -r data _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
